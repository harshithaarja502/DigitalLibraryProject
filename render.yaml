
services:
  - type: web
    name: digital-library-demo
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo_data && python manage.py ensure_admin
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo_data && python manage.py ensure_admin && gunicorn digitallibrary.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: digital-library-demo.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://digital-library-demo.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: digital-library-db
          property: connectionString

databases:
  - name: digital-library-db
    databaseName: digitallibrary
    user: digitallibrary_user
    plan: free
    region: oregon
